name: Deploy GarmentClothLab
on:
  push:
    branches: [feat/garment-cloth-prototype]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Pages was already enabled manually. Skip configure-pages because the
      # GitHub App integration cannot read/create the Pages site in this repo.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
